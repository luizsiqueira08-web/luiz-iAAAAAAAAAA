!<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Neymar Jr.</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1a1a1a;
      border: 2px solid #ffffff;
      border-radius: 8px;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    p {
      color: #cccccc;
      font-size: 1.1rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .btn {
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #ffffff;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      border-radius: 4px;
      margin-top: 15px;
    }

    .btn:hover {
      background-color: #000000;
      color: #ffffff;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: #111111;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 14px 18px;
      text-align: left;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .option-btn.correct {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: #333333 !important;
      color: #777777 !important;
      border-color: #333333 !important;
      text-decoration: line-through;
    }

    .progress {
      font-size: 0.9rem;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .score-display {
      font-size: 3rem;
      font-weight: bold;
      margin: 20px 0;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tela Inicial -->
    <div id="start-screen" class="screen active">
      <h1>Quiz Neymar Jr.</h1>
      <p>Teste seus conhecimentos sobre a trajetória, conquistas e história do craque.</p>
      <button class="btn" id="start-btn">Iniciar Quiz</button>
    </div>

    <!-- Tela do Quiz -->
    <div id="quiz-screen" class="screen">
      <div class="progress" id="progress">Pergunta 1 de 5</div>
      <h2 id="question-text" style="font-size: 1.3rem; margin-bottom: 20px;"></h2>
      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- Tela Final -->
    <div id="end-screen" class="screen">
      <h1>Fim de Jogo!</h1>
      <p>Sua pontuação final foi:</p>
      <div class="score-display" id="final-score">0 / 5</div>
      <p id="score-message"></p>
      <button class="btn" id="restart-btn">Reiniciar Quiz</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "Em qual clube Neymar iniciou sua carreira profissional de futebol?",
        options: ["Barcelona", "Santos FC", "Paris Saint-Germain", "Palmeiras"],
        answer: 1
      },
      {
        question: "Em que ano Neymar conquistou a UEFA Champions League pelo Barcelona?",
        options: ["2011", "2013", "2015", "2017"],
        answer: 2
      },
      {
        question: "Qual foi o valor recorde de sua transferência do Barcelona para o PSG em 2017?",
        options: ["180 milhões de €", "222 milhões de €", "100 milhões de €", "250 milhões de €"],
        answer: 1
      },
      {
        question: "Qual título inédito Neymar conquistou com a Seleção Brasileira em 2016 no Maracanã?",
        options: ["Copa do Mundo", "Copa América", "Ouro Olímpico", "Copa das Confederações"],
        answer: 2
      },
      {
        question: "Em 2023, para qual clube do futebol árabe Neymar se transferiu?",
        options: ["Al-Nassr", "Al-Ittihad", "Al-Hilal", "Al-Ahli"],
        answer: 2
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const endScreen = document.getElementById('end-screen');

    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const progressText = document.getElementById('progress');
    const finalScore = document.getElementById('final-score');
    const scoreMessage = document.getElementById('score-message');

    startBtn.addEventListener('click', startQuiz);
    restartBtn.addEventListener('click', startQuiz);

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      startScreen.classList.remove('active');
      endScreen.classList.remove('active');
      quizScreen.classList.add('active');
      showQuestion();
    }

    function showQuestion() {
      canAnswer = true;
      const q = questions[currentQuestionIndex];
      progressText.innerText = `Pergunta ${currentQuestionIndex + 1} de ${questions.length}`;
      questionText.innerText = q.question;
      optionsContainer.innerHTML = '';

      q.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.innerText = option;
        button.classList.add('option-btn');
        button.addEventListener('click', () => selectOption(index, button));
        optionsContainer.appendChild(button);
      });
    }

    function selectOption(selectedIndex, selectedButton) {
      if (!canAnswer) return;
      canAnswer = false;

      const correctIndex = questions[currentQuestionIndex].answer;
      const buttons = optionsContainer.querySelectorAll('.option-btn');

      if (selectedIndex === correctIndex) {
        score++;
        selectedButton.classList.add('correct');
      } else {
        selectedButton.classList.add('wrong');
        buttons[correctIndex].classList.add('correct');
      }

      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
          showQuestion();
        } else {
          showEndScreen();
        }
      }, 1200);
    }

    function showEndScreen() {
      quizScreen.classList.remove('active');
      endScreen.classList.add('active');
      finalScore.innerText = `${score} / ${questions.length}`;

      if (score === questions.length) {
        scoreMessage.innerText = "Perfeito! Você é um verdadeiro especialista na carreira do Neymar.";
      } else if (score >= 3) {
        scoreMessage.innerText = "Muito bom! Você conhece bem os momentos marcantes do craque.";
      } else {
        scoreMessage.innerText = "Vale a pena revisar a história do camisa 10 e tentar novamente!";
      }
    }
  </script>
</body>
</html>
